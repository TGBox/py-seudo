[project]
name = "py-seudo"
version = "0.4.0"
description = "DSGVO-konforme Pseudonymisierung von ESOL-Abrechnungsdateien und Rueckmeldungsemails."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Daniel Rösch" }
]
dependencies = [
    "pyside6>=6.6.0",
]

[project.scripts]
py-seudo = "py_seudo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_seudo"]

[dependency-groups]
dev = [
    "pyinstaller>=6.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
